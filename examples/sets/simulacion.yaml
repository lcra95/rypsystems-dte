# SIMULACION - Documentos que representan la operación de RYP AI SYSTEMS
# (servicios de tecnologías de la información, Acteco 620900).
# Requisitos del SII para la simulación: un único envío con entre 20 y 100
# documentos, de todos los tipos que se están certificando (33, 34, 43, 46,
# 52, 56, 61, 110, 111, 112; las boletas se certifican aparte) y con datos de
# la operación (no los del set de pruebas). Sin referencia SET.
# Los receptores nacionales rotan entre los de empresa_certificacion.yaml.
nombre: simulacion
referencia_set: false

exportacion_servicios: &exportacion
  IdDoc: {IndServicio: 3, FmaPagExp: 32}
  Receptor:
    RUTRecep: 55555555-5
    RznSocRecep: Northwind Software Inc.
    Extranjero: {Nacionalidad: 225}
    GiroRecep: Desarrollo de software
    DirRecep: 500 Market Street, San Francisco
  Transporte:
    Aduana:
      CodClauVenta: 6          # S/CL
      CodViaTransp: 4          # Aéreo
      CodPtoEmbarque: 992      # Aeropuerto A. Merino Benítez
      CodPtoDesemb: 180        # Otros puertos de EE.UU.
      CodPaisRecep: 225        # U.S.A.
      CodPaisDestin: 225
  Totales: {TpoMoneda: DOLAR USA}
  OtraMoneda: {TpoMoneda: PESO CL, TpoCambio: 950}

